name: CI

# Quality gates. Runs on every pull request and on pushes to main.
#
# This exists because pushing to main deploys straight to production
# (see deploy.yml) and, until this workflow, nothing checked the code first.
#
# Deliberately builds with no config or secrets present: the frontend must never
# depend on a build-time secret, and a build that only works with one would hide
# that. Nothing here touches the server or the production database.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Blocking, at zero. It reported 27 errors, then 19, and now none.
      #
      # The last 19 were React 19's hook ruleset on working code, and were
      # cleared by changing the code rather than the rules: the unreferenced
      # FullCalendar template under src/components/calendar was deleted (it read
      # a ref during render, so its own title never updated); icons are rendered
      # with createElement() where a capitalised local read as a component
      # defined during render; effects no longer set state synchronously in
      # Scheduling, Verify, the auth provider and the theme toggle; homeFor(),
      # openStorageNotice() and PageLoader moved out of the modules that mix them
      # with components; and the vendored sidebar skeleton derives its width from
      # useId() instead of Math.random().
      #
      # --max-warnings 0 so a warning cannot quietly become the new baseline.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "dist/manifest.webmanifest missing"; exit 1; }
          test -f dist/sw.js || { echo "dist/sw.js missing"; exit 1; }
          # Source maps must never ship — they would publish the whole frontend source.
          maps=$(find dist -name '*.map' | wc -l)
          test "$maps" -eq 0 || { echo "$maps source map(s) in dist/"; exit 1; }

  php:
    name: PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Match the production host (PHP 8.4 on cPanel) so a syntax error that only
      # appears on that version is caught here rather than after an FTP upload.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Syntax-check every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || { echo "SYNTAX ERROR: $file"; php -l "$file"; status=1; }
          done < <(find server -name '*.php' -print0)
          exit $status

      # Pure server-side logic: credential expiry banding, the staff/worker/client
      # distinction, field status, pay premiums. No database, no config.php.
      - name: PHP unit tests
        run: php server/tests/run.php

      - name: Refuse a committed config.php
        run: |
          # config.php holds the database password and every API key. It is
          # gitignored; if it ever appears in the tree, fail loudly.
          if git ls-files --error-unmatch server/config.php > /dev/null 2>&1; then
            echo "server/config.php is tracked in git. It must never be committed."
            exit 1
          fi

  database:
    name: Database-backed HTTP tests
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      RG_TEST_DB_HOST: 127.0.0.1
      RG_TEST_DB_USER: root
      RG_TEST_DB_PASS: rg_ci_local_only
      RG_TEST_DB_NAME: ritagreen_os_test

    # server/tests/run.php covers the pure logic and says so: anything needing a
    # database is out of its scope. That left authorisation, service scope, state
    # transitions and persistence untested by anything -- and those are the parts
    # that decide who can read a worker's compliance record.
    #
    # This job builds a database from server/schema.sql and every migration on
    # each run, so "a fresh install works" is asserted rather than remembered. It
    # was not working: schema.sql altered a table it never created, and repeated
    # three statements the migrations own, so a new database stopped at migration
    # 020 with eleven migrations unapplied.
    #
    # MariaDB, not MySQL: the host runs MariaDB and schema.sql and the migrations
    # use its ADD COLUMN / ADD KEY IF NOT EXISTS, which stock MySQL 8 rejects
    # (docs/ARCHITECTURE.md). On mysql:8.0 this job failed at schema.sql before a
    # single case ran.
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rg_ci_local_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli, curl
          coverage: none

      # No config.php is present and none is created. The suite loads
      # server/tests/db/config.php through RG_CONFIG, which holds no secret and
      # switches every outbound integration off. Nothing here can email anyone.
      - name: Refuse to run with a config.php present
        run: |
          if [ -f server/config.php ]; then
            echo "server/config.php exists in the CI checkout. It must never be committed."
            exit 1
          fi

      # Called directly rather than through npm: the job installs no node
      # modules, and the script is one php invocation.
      - name: Database-backed HTTP tests
        run: php server/tests/db/run.php

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails if docs/PROGRESS.md is out of step with docs/STATUS.json, if
      # docs/TRACEABILITY.md cites a source file that does not exist, if a relative
      # markdown link in docs/, the root, .agent/ or server/README.md is broken, or
      # if a retired brand colour reappears in src/ or docs/.
      - name: Test the documentation checks and the agent guard hooks
        run: python3 scripts/test_docs_sync.py && python3 scripts/test_agent_guard.py
      - name: Check documentation consistency
        run: python3 scripts/docs_sync.py --check
