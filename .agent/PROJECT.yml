project:
  name: "ritagreen_os"
  type: "pwa"
  lifecycle: "maintenance"
  risk: "production"

stage:
  current: "2026 build complete on the build branch (sections S0 to S10), pending release to production"
  updated: "2026-10-10"
  next_contract: "Production release, by the owner's decision, following docs/runbooks/release-2026.md"
  remaining_work: "docs/ROADMAP.md"

gee_os:
  minimum_version: "0.9.0"
  primary_mode: "EXISTING-APPLICATION"
  workflows:
    - "CHANGE-SAFETY"
    - "PROJECT-RECOVERY"
  conditional_workflows:
    - "PWA-RELEASE"
    - "WEBSITE-LAUNCH"
    - "RELEASE-GATE"

sources_of_truth:
  project_memory: "CLAUDE.md (standing traps and working rules, for every agent)"
  product_overview: "README.md and docs/PRD.md"
  modules_as_built: "docs/BLUEPRINT.md"
  decisions: "docs/DECISIONS-2026.md"
  rules: "docs/RULES.md"
  design: "docs/DESIGN_SYSTEM.md"
  api: "docs/API.md"
  schema: "docs/SCHEMA.md and server/migrations/"
  progress: "docs/STATUS.json, rendered as docs/PROGRESS.md"
  roadmap: "docs/ROADMAP.md"
  runbooks: "docs/runbooks/"
  implementation: "source tree and package.json"
  current_task: ".agent/CURRENT-TASK.md"
  integration_authority: ".agent/MCP-PROFILE.yml"

exclusions:
  - "pushing to or merging into main, which deploys production, without the owner's go"
  - "applying migrations to, or reading, the production database"
  - "reading or printing server/config.php, or copying any secret"
  - "real email, SMS, WhatsApp, payment or social account actions"
  - "deleting docs/Plans 2026/ before the owner approves it"

mcp_profile: ".agent/MCP-PROFILE.yml"
