    <meta property="og:description" content="Reliable care staff when your rota can't wait. Carers, support workers and nurses across London, plus cleaning, security and training from the same team." />
    <meta property="og:url" content="https://ritagreenservices.com/" />
    <meta property="og:image" content="https://ritagreenservices.com/og.png" />

      {
        "@context": "https://schema.org",

        "name": "RitaGreen Services",
        "legalName": "RitaGreen Services Ltd",
        "url": "https://ritagreenservices.com/",
        "telephone": "0203 105 2218",
        "email": "hello@ritagreenservices.com",

      }
    </script>
    <!-- Webfonts are self-hosted: see src/fonts.css and public/fonts.

         They used to load from fonts.googleapis.com, which meant every visitor's
         IP address and User-Agent reached Google on first paint — before the
         page had asked them anything, and disclosed in neither the privacy nor
         the cookie notice. Serving the files ourselves removes the only
         third-party request the site made. There is now nothing to disclose and
         nothing to seek consent for, which is a better answer than a banner. -->
    <!-- Two icon-font CDNs used to load here, both render-blocking, both from
         third-party origins, and neither cached by the service worker (so they
         also failed on every offline load).

         Boxicons was used for NOTHING: not one `bx-*` class anywhere in src/.
         Bootstrap Icons was used for exactly one glyph, `bi-twitter-x` in the
         footer, at a cost of 14 kB of CSS plus a 131 kB webfont. That icon is
         now an inline SVG. Removing both drops ~168 kB of blocking third-party
         transfer from every page and lets the CSP stop allow-listing them. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
