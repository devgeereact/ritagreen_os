<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RitaGreen Services — care, training, cleaning and security staff across London. Trained, checked, ready." />
    <meta name="theme-color" content="#0C447C" />
    <!-- The manifest link is injected by vite-plugin-pwa at build time. -->
    <!-- iOS ignores an SVG touch icon, so this one is a PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>RitaGreen Services — Care, Training, Cleaning & Security in London</title>
    <link rel="canonical" href="https://ritagreenservices.com/" />
    <meta property="og:site_name" content="RitaGreen Services" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RitaGreen Services — Care, Training, Cleaning & Security in London" />
    <meta property="og:description" content="One trusted London name for care staff, training, cleaning and security. Every worker qualified, checked and ready." />
    <meta property="og:url" content="https://ritagreenservices.com/" />
    <meta property="og:image" content="https://ritagreenservices.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RitaGreen Services — care, training, cleaning and security staff across London." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ritagreenservices.com/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RitaGreen Services Ltd",
        "url": "https://ritagreenservices.com",
        "email": "hello@ritagreenservices.com",
        "areaServed": "London, United Kingdom",
        "slogan": "Qualified. Checked. Ready.",
        "description": "One trusted name for staff, training, cleaning and security — every worker qualified, checked and ready."
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Two icon-font CDNs used to load here, both render-blocking, both from
         third-party origins, and neither cached by the service worker (so they
         also failed on every offline load).

         Boxicons was used for NOTHING: not one `bx-*` class anywhere in src/.
         Bootstrap Icons was used for exactly one glyph, `bi-twitter-x` in the
         footer, at a cost of 14 kB of CSS plus a 131 kB webfont. That icon is
         now an inline SVG. Removing both drops ~168 kB of blocking third-party
         transfer from every page and lets the CSP stop allow-listing them. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
